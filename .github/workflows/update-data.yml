name: Update ECMWF Data

on:
  schedule:
    # Run every 6 hours at 05, 11, 17, 23 UTC
    # (1 hour after ECMWF data becomes available at 00, 06, 12, 18 UTC + 1 hour delay)
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create data directory
        run: |
          mkdir -p data/ecmwf/ifs/forecast-15-day
          mkdir -p .cache/ecmwf

      - name: Run update
        run: |
          python -m reformatters update
        env:
          PYTHONUNBUFFERED: 1

      - name: Validate dataset
        run: |
          python -m reformatters validate

      - name: Display dataset info
        run: |
          python -m reformatters info

      - name: Generate preview visualizations
        run: |
          mkdir -p docs/previews
          python src/reformatters/generate_previews.py
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add data files and preview images
          git add data/
          git add docs/previews/ || true

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Update ECMWF forecast data - ${TIMESTAMP}"
            git push
          fi

      - name: Trigger Pages deployment
        if: success()
        run: |
          echo "Data updated successfully. GitHub Pages will be rebuilt automatically."
