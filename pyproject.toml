[project]
name = "ecmwf-open-data-to-zarr"
version = "0.1.0"
description = "Reformat ECMWF Open Data forecasts into Zarr format"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "ECMWF Open Data to Zarr Contributors" }
]

dependencies = [
    # Core data processing
    "xarray[complete]>=2025.1.2",
    "zarr>=3.0.8",
    "dask>=2025.0.0",
    "numcodecs>=0.16.0",

    # GRIB and geospatial
    "ecmwf-opendata>=0.3.9",
    "cfgrib>=0.9.14",
    "rioxarray>=0.19.0",
    "rasterio>=1.4.0",

    # Cloud storage
    "s3fs>=2025.3.0",
    "fsspec>=2025.1.0",

    # Configuration and CLI
    "pydantic>=2.10.0",
    "typer>=0.12.0",
    "rich>=13.0.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.10.0",
    "cartopy>=0.24.0",
]

[project.scripts]
ecmwf-zarr = "reformatters.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reformatters"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
